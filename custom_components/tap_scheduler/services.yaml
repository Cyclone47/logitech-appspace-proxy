popup_url:
  name: Popup URL / Camera Stream
  description: Temporarily switch the Tap Scheduler screen to a URL (e.g., doorbell camera view) and automatically return to the main dashboard after `duration` seconds.
  fields:
    url:
      name: URL
      description: The URL to display on the Tap Scheduler.
      required: true
      example: "http://homeassistant.local:8123/lovelace/cameras"
      selector:
        text:
    duration:
      name: Duration (seconds)
      description: Seconds before automatically returning to the base dashboard URL (0 = permanent).
      default: 60
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds

show_toast:
  name: Show Toast Notification
  description: Display a floating banner message at the bottom of the Tap Scheduler screen.
  fields:
    message:
      name: Message
      description: The text message to display on screen.
      required: true
      example: "Someone is at the front door!"
      selector:
        text:
    duration:
      name: Duration (seconds)
      description: How many seconds to show the banner.
      default: 6
      selector:
        number:
          min: 2
          max: 60
          unit_of_measurement: seconds

flash_alert:
  name: Flash Visual Alert
  description: Wake the Tap Scheduler screen and flash a high-contrast RGB alert border.
  fields:
    rgb_color:
      name: RGB Color
      description: Alert flash RGB color.
      default: [239, 68, 68]
      selector:
        color_rgb:

open_device_menu:
  name: Open Native Logitech / Appspace Menu
  description: Trigger the native Appspace / Logitech CollabOS Device Settings menu via WebSocket 55537.
